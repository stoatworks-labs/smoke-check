name: "Smoke-check a built static site"
description: "Serve a built site, open it in headless Chromium, and fail on any runtime error or an empty app root. Catches what a green build cannot: code that compiles and then throws on first render."
inputs:
  dir:        { description: "Directory holding the built site (index.html)", required: true }
  path:       { description: "URL path to load", default: "/" }
  root:       { description: "CSS selector for the app root that must render text", default: "#root, #app, main" }
  min-text:   { description: "Minimum rendered characters in the root", default: "20" }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        npm init -y >/dev/null
        npm i --no-audit --no-fund --loglevel=error playwright@1
        # The browser on its own: a download from Playwright's CDN, no apt.
        npx playwright install chromium
        # GitHub's hosted Ubuntu images already have the libraries Chromium needs, so try
        # launching it before touching apt. `--with-deps` ran apt-get update over every
        # source on the runner, and when one of them was down (Launchpad's PPAs, 2026-11-11)
        # it hung for ten minutes and failed jobs that never needed a package.
        probe='require("playwright").chromium.launch().then((b) => b.close())'
        if node -e "$probe" 2>/dev/null; then
          echo "Chromium launches, so its system libraries are already installed."
        else
          echo "Chromium won't launch yet. Installing its system libraries."
          if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO=sudo; fi
          echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "1";' \
            | $SUDO tee /etc/apt/apt.conf.d/99smoke-check-timeouts >/dev/null
          timeout 600 npx playwright install-deps chromium
          node -e "$probe"
        fi
    - shell: bash
      env:
        SMOKE_PATH: ${{ inputs.path }}
        SMOKE_ROOT: ${{ inputs.root }}
        SMOKE_MIN_TEXT: ${{ inputs.min-text }}
      run: node "${{ github.action_path }}/smoke.mjs" "${{ inputs.dir }}"
